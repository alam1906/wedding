services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_POCKETBASE_URL: ${PUBLIC_POCKETBASE_URL:-https://api-wedding.onlytest.my.id}
        PUBLIC_WEDDING_URL: ${PUBLIC_WEDDING_URL:-https://wedding.onlytest.my.id}
        PUBLIC_INVITATION_URL: ${PUBLIC_INVITATION_URL:-https://onlytest.my.id}
    restart: unless-stopped
    expose:
      - '80'

  invitation:
    build:
      context: .
      dockerfile: apps/invitation/Dockerfile
      args:
        PUBLIC_POCKETBASE_URL: ${PUBLIC_POCKETBASE_URL:-https://api-wedding.onlytest.my.id}
        PUBLIC_WEDDING_URL: ${PUBLIC_WEDDING_URL:-https://wedding.onlytest.my.id}
        PUBLIC_INVITATION_URL: ${PUBLIC_INVITATION_URL:-https://onlytest.my.id}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    expose:
      - '3000'
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=dokploy-network'
      - 'traefik.http.middlewares.wedez-invitation-https.redirectscheme.scheme=https'
      - 'traefik.http.middlewares.wedez-invitation-https.redirectscheme.permanent=true'
      - 'traefik.http.routers.wedez-invitation-http.rule=HostRegexp(`[a-z0-9-]+[.]onlytest[.]my[.]id`)'
      - 'traefik.http.routers.wedez-invitation-http.entrypoints=web'
      - 'traefik.http.routers.wedez-invitation-http.priority=1'
      - 'traefik.http.routers.wedez-invitation-http.middlewares=wedez-invitation-https'
      - 'traefik.http.routers.wedez-invitation-http.service=wedez-invitation'
      - 'traefik.http.routers.wedez-invitation-websecure.rule=HostRegexp(`[a-z0-9-]+[.]onlytest[.]my[.]id`)'
      - 'traefik.http.routers.wedez-invitation-websecure.entrypoints=websecure'
      - 'traefik.http.routers.wedez-invitation-websecure.priority=1'
      - 'traefik.http.routers.wedez-invitation-websecure.tls=true'
      - 'traefik.http.routers.wedez-invitation-websecure.service=wedez-invitation'
      - 'traefik.http.services.wedez-invitation.loadbalancer.server.port=3000'

  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
      args:
        PB_VERSION: ${PB_VERSION:-0.40.1}
    restart: unless-stopped
    environment:
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:?Set PB_ENCRYPTION_KEY sepanjang 32 karakter}
      WEDEZ_APP_URL: ${WEDEZ_APP_URL:-https://wedding.onlytest.my.id}
      WEDEZ_API_URL: ${WEDEZ_API_URL:-https://api-wedding.onlytest.my.id}
      WEDEZ_PRO_PRICE: ${WEDEZ_PRO_PRICE:-50000}
      DUITKU_ENV: ${DUITKU_ENV:-production}
      DUITKU_MERCHANT_CODE: ${DUITKU_MERCHANT_CODE:?Set DUITKU_MERCHANT_CODE}
      DUITKU_API_KEY: ${DUITKU_API_KEY:?Set DUITKU_API_KEY}
      DUITKU_API_URL: ${DUITKU_API_URL:-https://api-prod.duitku.com}
      DUITKU_CALLBACK_URL: ${DUITKU_CALLBACK_URL:?Set DUITKU_CALLBACK_URL}
      DUITKU_RETURN_URL: ${DUITKU_RETURN_URL:?Set DUITKU_RETURN_URL}
      DUITKU_EXPIRY_MINUTES: ${DUITKU_EXPIRY_MINUTES:-60}
    expose:
      - '8090'
    volumes:
      - pocketbase-data:/pb/pb_data
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=dokploy-network'
      - 'traefik.http.middlewares.wedez-pocketbase-https.redirectscheme.scheme=https'
      - 'traefik.http.middlewares.wedez-pocketbase-https.redirectscheme.permanent=true'
      - 'traefik.http.routers.wedez-pocketbase-http.rule=Host(`api-wedding.onlytest.my.id`)'
      - 'traefik.http.routers.wedez-pocketbase-http.entrypoints=web'
      - 'traefik.http.routers.wedez-pocketbase-http.middlewares=wedez-pocketbase-https'
      - 'traefik.http.routers.wedez-pocketbase-http.service=wedez-pocketbase'
      - 'traefik.http.routers.wedez-pocketbase-websecure.rule=Host(`api-wedding.onlytest.my.id`)'
      - 'traefik.http.routers.wedez-pocketbase-websecure.entrypoints=websecure'
      - 'traefik.http.routers.wedez-pocketbase-websecure.tls=true'
      - 'traefik.http.routers.wedez-pocketbase-websecure.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.wedez-pocketbase-websecure.service=wedez-pocketbase'
      - 'traefik.http.services.wedez-pocketbase.loadbalancer.server.port=8090'

volumes:
  pocketbase-data:

networks:
  dokploy-network:
    external: true
