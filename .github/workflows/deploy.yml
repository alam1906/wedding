name: Build and deploy Wedez

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wedez-production
  cancel-in-progress: false

env:
  PUBLIC_POCKETBASE_URL: ${{ vars.PUBLIC_POCKETBASE_URL || 'https://api.wedez.id' }}
  PUBLIC_WEDDING_URL: ${{ vars.PUBLIC_WEDDING_URL || 'https://wedez.id' }}
  PUBLIC_INVITATION_URL: ${{ vars.PUBLIC_INVITATION_URL || 'https://wedez.id' }}

jobs:
  quality:
    name: Check and lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Lint
        run: bun run lint

  images:
    name: Build ${{ matrix.service }} image
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: .
            dockerfile: ./apps/web/Dockerfile
          - service: invitation
            context: .
            dockerfile: ./apps/invitation/Dockerfile
          - service: admin
            context: .
            dockerfile: ./apps/admin/Dockerfile
          - service: pocketbase
            context: ./pocketbase
            dockerfile: ./pocketbase/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BUN_VERSION=1.4.0
            CADDY_VERSION=2.11.4
            PB_VERSION=0.40.1
            PUBLIC_POCKETBASE_URL=${{ env.PUBLIC_POCKETBASE_URL }}
            PUBLIC_WEDDING_URL=${{ env.PUBLIC_WEDDING_URL }}
            PUBLIC_INVITATION_URL=${{ env.PUBLIC_INVITATION_URL }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:production
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=wedez-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=wedez-${{ matrix.service }}

  deploy:
    name: Deploy through Dokploy
    if: github.event_name != 'pull_request'
    needs: images
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    env:
      DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
      DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      WEB_HEALTH_URL: ${{ vars.WEB_HEALTH_URL || 'https://wedez.id' }}
      ADMIN_HEALTH_URL: ${{ vars.ADMIN_HEALTH_URL || 'https://admin.wedez.id' }}
      INVITATION_HEALTH_URL: ${{ vars.INVITATION_HEALTH_URL || 'https://deploy-health.wedez.id' }}
      POCKETBASE_HEALTH_URL: ${{ vars.POCKETBASE_HEALTH_URL || 'https://api.wedez.id/api/health' }}
    steps:
      - name: Validate Dokploy configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DOKPLOY_URL" || { echo "Repository variable DOKPLOY_URL belum diisi." >&2; exit 1; }
          test -n "$DOKPLOY_COMPOSE_ID" || { echo "Repository variable DOKPLOY_COMPOSE_ID belum diisi." >&2; exit 1; }
          test -n "$DOKPLOY_API_KEY" || { echo "Repository secret DOKPLOY_API_KEY belum diisi." >&2; exit 1; }

      - name: Trigger Dokploy deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          base_url="${DOKPLOY_URL%/}"
          payload="$(jq -nc \
            --arg composeId "$DOKPLOY_COMPOSE_ID" \
            --arg title "GitHub ${GITHUB_SHA::12}" \
            --arg description "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            '{composeId: $composeId, title: $title, description: $description, freshVolumes: false}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${base_url}/api/compose.deploy" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_KEY}" \
            --data "$payload" >/dev/null

      - name: Verify deployed services
        shell: bash
        run: |
          set -Eeuo pipefail

          wait_for_revision() {
            local name="$1"
            local url="${2%/}/_wedez_revision"
            local expected_service="${3:-}"
            local actual=""
            local service=""

            for attempt in $(seq 1 36); do
              actual="$(curl --fail --silent --show-error --max-time 10 "$url" 2>/dev/null || true)"
              if [ "$actual" = "$GITHUB_SHA" ]; then
                if [ -z "$expected_service" ]; then
                  echo "$name menjalankan revision ${GITHUB_SHA::12} setelah percobaan $attempt."
                  return 0
                fi
                service="$(curl --fail --silent --show-error --max-time 10 "${2%/}/_wedez_service" 2>/dev/null || true)"
                if [ "$service" = "$expected_service" ]; then
                  echo "$name menjalankan revision ${GITHUB_SHA::12} setelah percobaan $attempt."
                  return 0
                fi
              fi
              sleep 10
            done

            echo "$name belum menjalankan revision ${GITHUB_SHA::12}." >&2
            return 1
          }

          wait_for_http_200() {
            local name="$1"
            local url="$2"

            for attempt in $(seq 1 36); do
              if curl --fail --silent --show-error --max-time 10 "$url" >/dev/null 2>&1; then
                echo "$name sehat setelah percobaan $attempt."
                return 0
              fi
              sleep 10
            done

            echo "$name tidak sehat: $url" >&2
            return 1
          }

          wait_for_revision "Web" "$WEB_HEALTH_URL" &
          web_pid=$!
          wait_for_revision "Admin" "$ADMIN_HEALTH_URL" "admin" &
          admin_pid=$!
          wait_for_revision "Invitation" "$INVITATION_HEALTH_URL" &
          invitation_pid=$!
          wait_for_http_200 "Admin page" "$ADMIN_HEALTH_URL" &
          admin_page_pid=$!
          wait_for_http_200 "PocketBase" "$POCKETBASE_HEALTH_URL" &
          pocketbase_pid=$!

          result=0
          wait "$web_pid" || result=1
          wait "$admin_pid" || result=1
          wait "$invitation_pid" || result=1
          wait "$admin_page_pid" || result=1
          wait "$pocketbase_pid" || result=1
          exit "$result"
