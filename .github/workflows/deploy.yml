name: Deploy Wedez

on:
  push:
    branches:
      - main

concurrency:
  group: wedez-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      PUBLIC_POCKETBASE_URL: https://api-wedding.onlytest.my.id
      PUBLIC_WEDDING_URL: https://wedding.onlytest.my.id
      PUBLIC_INVITATION_URL: https://onlytest.my.id

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Deploy PocketBase
        uses: dokku/github-action@v1.10.0
        with:
          branch: main
          git_remote_url: ssh://dokku@${{ vars.DOKKU_HOST }}:22/wedez-pocketbase
          ssh_private_key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}

      - name: Deploy Web
        uses: dokku/github-action@v1.10.0
        with:
          branch: main
          git_remote_url: ssh://dokku@${{ vars.DOKKU_HOST }}:22/wedez-web
          ssh_private_key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}

      - name: Deploy Invitation
        uses: dokku/github-action@v1.10.0
        with:
          branch: main
          git_remote_url: ssh://dokku@${{ vars.DOKKU_HOST }}:22/wedez-invitation
          ssh_private_key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
