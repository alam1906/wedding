<!doctype html>
<html lang="id">

		<title>Template email Wedez</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: #f7f6fa;
				color: #281638;
				font:
					14px/1.6 Arial,
					Helvetica,
					sans-serif;
			}
			header {
				padding: 28px 24px;
				border-bottom: 1px solid #e7e0ef;
				background: white;
			}
			main {
				max-width: 1120px;
				margin: 30px auto;
				padding: 0 24px;
				display: grid;
				grid-template-columns: 300px minmax(0, 1fr);
				gap: 32px;
			}
			h1 {
				margin: 0;
				font-size: 24px;
				letter-spacing: -0.6px;
			}
			p {
				margin: 8px 0;
				color: #756b80;
			}
			label {
				display: block;
				font-size: 12px;
				font-weight: bold;
				margin: 20px 0 6px;
			}
			select,
			button {
				font: inherit;
				border: 1px solid #dcd2e8;
				border-radius: 10px;
				padding: 11px 12px;
				background: white;
				color: #4b355c;
				cursor: pointer;
			}
			select {
				width: 100%;
			}
			button.primary {
				background: #7200e8;
				color: white;
				border-color: #7200e8;
			}
			button:focus-visible,
			select:focus-visible {
				outline: 3px solid #cbb5f7;
				outline-offset: 3px;
			}
			.buttons {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				margin-top: 16px;
			}
			.subject {
				font-size: 16px;
				font-weight: bold;
				line-height: 1.5;
				overflow-wrap: anywhere;
			}
			.note {
				font-size: 12px;
				border-top: 1px solid #e7e0ef;
				margin-top: 22px;
				padding-top: 14px;
			}
			iframe {
				display: block;
				width: 100%;
				height: 1000px;
				border: 1px solid #e7e0ef;
				border-radius: 12px;
				background: white;
				margin: auto;
			}
			.viewport {
				overflow: auto;
				min-width: 0;
			}
			#status {
				min-height: 24px;
				color: #7200e8;
				margin-top: 10px;
				font-size: 12px;
			}
			#field {
				font-family: monospace;
				font-size: 12px;
				color: #7200e8;
				overflow-wrap: anywhere;
			}
			.widths {
				margin: 0 0 12px;
				display: flex;
				gap: 8px;
				justify-content: flex-end;
			}
			@media (max-width: 760px) {
				main {
					grid-template-columns: 1fr;
					gap: 20px;
					padding: 0 14px;
					margin-top: 16px;
				}
				header {
					padding: 18px;
				}
				iframe {
					height: 1150px;
				}
				.widths {
					justify-content: flex-start;
				}
			}
		</style>
	</head>

				</div>
				<iframe title="Pratinjau email" sandbox=""></iframe>
			</section>

			const selector = document.getElementById('template');
			const frame = document.querySelector('iframe');
			const samples = {
				'{APP_URL}': 'https://api.wedez.id',
				'{APP_NAME}': 'Wedez',
				'{TOKEN}': 'contoh-token-pratinjau',

				'{ALERT_INFO}': 'Chrome · macOS · IP 203.0.113.24'
			};
			const sample = (text) =>
				Object.entries(samples).reduce(
					(result, [key, value]) => result.replaceAll(key, value),
					text
				);
			for (const item of templates) {
				const option = document.createElement('option');
				option.value = item.id;
				option.textContent = item.name;
				selector.append(option);
			}
			const current = () => templates.find((item) => item.id === selector.value);
			const params = new URLSearchParams(location.search);
			if (templates.some((item) => item.id === params.get('template')))
				selector.value = params.get('template');
			if (params.get('width') === '375px') frame.style.width = '375px';
			function render() {
				const item = current();
				document.getElementById('subject').textContent = item.subject;
				document.getElementById('field').textContent =
					item.field || 'Tambahan — tidak tersedia sebagai field bawaan';
				document.getElementById('notice').textContent =
					item.id === 'password-reset'

								? 'Placeholder {ALERT_INFO} hanya tersedia pada email peringatan login baru. Tombol keamanan menuju halaman pemulihan Wedez produksi.'
								: 'Simpan Subject dan Body pada field di atas. {APP_URL} mengikuti Application URL PocketBase untuk environment yang digunakan.';
				frame.srcdoc =
					'<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0;padding:20px 30px;background:white;font-family:Arial,Helvetica,sans-serif;">' +

					'</body></html>';
				document.getElementById('status').textContent = '';

			async function copy(text, label) {
				document.getElementById('copy-fallback')?.remove();
				let copied = false;
				if (navigator.clipboard)
					copied = await navigator.clipboard.writeText(text).then(
						() => true,
						() => false
					);
				if (!copied) {
					const input = document.createElement('textarea');
					input.id = 'copy-fallback';
					input.value = text;

					input.setAttribute('aria-label', label + ' untuk disalin manual');
					input.style.cssText = 'position:fixed;top:0;left:0;opacity:0;width:1px;height:1px;';
					document.getElementById('status').after(input);
					input.focus();
					input.select();
					try {
						copied = document.execCommand('copy');
					} catch {
						copied = false;
					}
					if (copied) {
						input.remove();
					} else {
						input.style.cssText =
							'width:100%;height:150px;margin:8px 0;border:1px solid #dcd2e8;border-radius:8px;padding:10px;font:12px monospace;';
						input.focus();
						input.select();
					}
				}
				document.getElementById('status').textContent = copied
					? label + ' berhasil disalin.'
					: 'Teks sudah dipilih. Tekan Cmd+C (Mac) atau Ctrl+C untuk menyalin.';
			}
			document.getElementById('copy-subject').onclick = () => copy(current().subject, 'Subject');
			document.getElementById('copy-body').onclick = () => copy(current().body, 'Body HTML');
			selector.onchange = render;
			document
				.querySelectorAll('[data-width]')
				.forEach((button) => (button.onclick = () => (frame.style.width = button.dataset.width)));
			render();
		</script>
	</body>
</html>
